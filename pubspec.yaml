name: calculadora_margenes_ve
description: "Calculadora de márgenes para vendedores en Venezuela: costo en USD, tasa del día (BCV, Binance USDT, Euro BCV o personalizada), comisiones y margen deseado → precio de venta en bolívares sin perder dinero."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
