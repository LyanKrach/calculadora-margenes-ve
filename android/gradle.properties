# SOLO para esta VM (7,7 GB RAM, ~1 GB libre): el template pide -Xmx8G y el
# daemon de Gradle no arranca. En el PC de Layan se deja el valor del template.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# Cambiado a true en el scaffold: con AGP 9.1 + Flutter 3.47, el plugin
# kotlin-android explícito está deprecado (warning del build). Con
# builtInKotlin=true, AGP compila el Kotlin (MainActivity) sin ese plugin.
android.builtInKotlin=true
